services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: recsys-backend
    ports:
      - "8001:8001"
    volumes:
      - ../../airflow/models:/app/models
      - ../../airflow/data:/app/data
    environment:
      - MODEL_PATH=/app/models/xgb_best_model.pkl
      - DATA_DIR=/app/data
      - PYTHONUNBUFFERED=1
    networks:
      - recsys-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: recsys-frontend
    ports:
      - "7861:7861"
    environment:
      - BACKEND_URL=http://backend:8001
    depends_on:
      - backend
    networks:
      - recsys-network
    restart: unless-stopped

networks:
  recsys-network:
    driver: bridge